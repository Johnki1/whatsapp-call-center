services:
  postgres:
    image: postgres:16-alpine
    container_name: botwap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botwap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botwap_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-botwap}
    ports:
      # El puerto 5433 es SOLO para acceso desde el host (WSL2).
      # Dentro de la red docker, el backend usa postgres:5432.
      # Publicado SOLO en loopback: en producción nada externo
      # debe alcanzar PostgreSQL directamente (Nginx no lo usa).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botwap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botwap} -d ${POSTGRES_DB:-botwap}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: botwap_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Conexión INTERNA a PostgreSQL (nombre del servicio = "postgres", puerto interno 5432)
      R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-botwap}
      R2DBC_USER: ${POSTGRES_USER:-botwap}
      R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-botwap_dev_password}
      FLYWAY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-botwap}
      FLYWAY_DB_USER: ${POSTGRES_USER:-botwap}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-botwap_dev_password}
      BOT_WHATSAPP_CLIENT: ${BOT_WHATSAPP_CLIENT:-mock}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change_me_webhook_verify_token}
      # Integración Meta (perfil "meta"): valores provistos por .env
      # generado por Ansible a partir de Azure Key Vault (Fase 7C-2).
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_GEMINI_ENABLED: ${APP_GEMINI_ENABLED:-true}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Sin estas dos líneas, Docker no reenvía las variables al contenedor y
      # cualquier ajuste en /opt/botwap/.env se ignoraba (se usaba el default
      # del application.yml: 8 s de timeout, causa del ReadTimeoutException).
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-25000}
      APP_GEMINI_THINKING_BUDGET: ${APP_GEMINI_THINKING_BUDGET:-0}
    ports:
      # Publicado SOLO en loopback: Nginx (reverse proxy) es la única
      # puerta de entrada pública. El NSG de Azure bloquea 8080, y este
      # binding añade defensa en profundidad.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - botwap-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:

networks:
  botwap-network:
    driver: bridge