# ============================================================
# BotWap — Inventario Ansible (Fase 7C-2)
# ============================================================
# VM Ubuntu 24.04 creada por Terraform (Fase 7C):
#   Standard_B2als_v2, northcentralus, IP pública estática.
#
# La clave privada SSH vive en ../terraform/id_ed25519_azure
# (fuera de Git vía .gitignore; fuente canónica: ~/.ssh/id_ed25519_azure).
# ============================================================

[botwap]
botwap-prod ansible_host=20.88.28.27 ansible_user=azureadmin ansible_ssh_private_key_file=../terraform/id_ed25519_azure ansible_python_interpreter=/usr/bin/python3

[botwap:vars]
# Acepta la huella del host nuevo en la primera conexión (evita bloqueo interactivo)
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
